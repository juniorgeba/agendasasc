[PHP]

; ----------------------------
; Configurações gerais
; ----------------------------

; Tempo máximo de execução de um script (segundos)
max_execution_time = 120

; Tempo máximo para receber dados via POST
max_input_time = 60

; Memória máxima que um script pode usar
memory_limit = 256M

; Nunca exibir erros na tela: em produção o stack trace revelaria caminhos do servidor
; e trechos de configuração. O Laravel registra tudo no log, que vai para o stdout.
display_errors = Off

; Registrar erros no log
log_errors = On

; ----------------------------
; Upload de arquivos
; ----------------------------

; Habilitar upload de arquivos
file_uploads = On

; Tamanho máximo de arquivo enviado
upload_max_filesize = 20M

; Tamanho máximo do corpo da requisição POST
post_max_size = 25M

; ----------------------------
; Internacionalização
; ----------------------------

; Timezone padrão (importante para o Laravel)
date.timezone = America/Sao_Paulo

; Encoding padrão
default_charset = UTF-8

; ----------------------------
; Sessão
; ----------------------------

; Tempo de vida da sessão (segundos) - 2 horas
session.gc_maxlifetime = 7200

; ----------------------------
; OPcache (melhora performance)
; ----------------------------

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.fast_shutdown = 1

; Em produção o código é imutável (está na imagem), então não revalidar timestamps.
; Isso elimina a checagem de mtime a cada request — ganho real de performance.
; ATENÇÃO: com isto ativo, toda alteração de código exige rebuild da imagem.
opcache.validate_timestamps = 0
