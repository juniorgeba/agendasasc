name: agendasasc

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-dev
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    container_name: agendasasc-php
    volumes:
      - .:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network

  queue:
    build:
      context: .
      dockerfile: Dockerfile-dev
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    container_name: agendasasc-queue
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile-dev
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    container_name: agendasasc-scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network

  nginx:
    image: nginx:1.29-alpine
    container_name: agendasasc-nginx
    ports:
      - "8010:80" # http://localhost:8010/
    volumes:
      - .:/var/www
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - network

  # Credenciais lidas do .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD).
  # Só valem na criação do volume db_data; depois disso, mudar o .env exige recriar o volume.
  mariadb:
    image: mariadb:12.3
    container_name: agendasasc-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    container_name: agendasasc-redis
    ports:
      - "6380:6379"
    networks:
      - network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agendasasc-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8090:8081" # http://localhost:8090/
    depends_on:
      - redis
    networks:
      - network

  mailpit:
    image: axllent/mailpit:latest
    container_name: agendasasc-mailpit
    ports:
      - "8030:8025" # Interface web para visualizar emails http://localhost:8030/
      - "1030:1025" # Porta SMTP
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  db_data:
